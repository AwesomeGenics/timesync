{% extends 'base.html' %}
{% block title %}Admin Console — TimeSync{% endblock %}
{% block body %}

<header class="topbar">
  <a class="brand" href="/admin_home">
    <span class="brand-icon">
      <span class="material-symbols-outlined">schedule</span>
    </span>
    <span>TimeSync</span>
  </a>
  <a class="action" id="admin" href="/logout">
    <span class="material-symbols-outlined">logout</span>
    <span>Logout</span>
  </a>
</header>

<main class="container">
  <div class="page-header">
    <h1>Hello, {{ name }}</h1>
  </div>

  <div class="card">
    <form class="stacked" action="/timetable_modify" method="post" id="table_selection">
      <div class="input-group">
        <label for="branch">
          <span class="material-symbols-outlined">school</span>
          Branch
        </label>
        <select name="branch" id="branch" required>
          <option value="AIML">AIML</option>
          <option value="CSBS">CSBS</option>
          <option value="CSDS">CSDS</option>
          <option value="CSCS">CSCS</option>
          <option value="IT">IT</option>
          <option value="IOT">IOT</option>
          <option value="CE&ME">CE&ME</option>
          <option value="ECE">ECE</option>
          <option value="ECS">ECS</option>
          <option value="EE">EE</option>
        </select>
      </div>

      <div class="field-row">
        <div class="input-group">
          <label for="semester">
            <span class="material-symbols-outlined">auto_stories</span>
            Semester
          </label>
          <select name="semester" id="semester">
            <option value="1">Semester 1</option>
          </select>
        </div>
        <div class="input-group">
          <label for="section">
            <span class="material-symbols-outlined">badge</span>
            Section
          </label>
          <input
            type="text"
            id="section"
            name="section"
            placeholder="e.g. A"
            required
            autocomplete="off"
          />
        </div>
      </div>

      <button type="submit" id="submit">
        <span class="material-symbols-outlined">edit_calendar</span>
        Modify Timetable
      </button>
    </form>
  </div>

  <div class="nav-actions">
    <a class="link-button" href="/create_account">
      <button type="button" class="ghost">
        <span class="material-symbols-outlined">person_add</span>
        New Admin
      </button>
    </a>
  </div>
</main>

{% block home_admin %}{% endblock %}
{% endblock %}
