{% extends 'base.html' %} {% block title %}Admin home{% endblock %} {% block body %}

<div class="topbar">
  <span class="brand">TimeSync</span>
  <a class="action" id="admin" href="/logout">Logout</a>
</div>

<div class="container">
  <h1>Hello, {{ name }}</h1>
  <p class="subtitle">Pick a branch and section to edit its timetable.</p>

  <div class="card">
    <form class="stacked" action="/timetable_modify" method="post" id="table_selection">
      <div>
        <label for="branch">Branch</label>
        <select name="branch" id="branch" required>
          <option value="AIML">AIML</option>
          <option value="CSBS">CSBS</option>
          <option value="CSDS">CSDS</option>
          <option value="CSCS">CSCS</option>
          <option value="IT">IT</option>
          <option value="IOT">IOT</option>
          <option value="CE&ME">CE&ME</option>
          <option value="ECE">ECE</option>
          <option value="ECS">ECS</option>
          <option value="EE">EE</option>
        </select>
      </div>

      <div class="field-row">
        <div>
          <label for="semester">Semester</label>
          <select name="semester" id="semester">
            <option value="1">Semester 1</option>
          </select>
        </div>
        <div>
          <label for="section">Section</label>
          <input type="text" id="section" name="section" placeholder="e.g. A" />
        </div>
      </div>

      <input type="submit" id="submit" value="Modify timetable" />
    </form>
  </div>

  <a class="link-button" href="/create_account">
    <button type="button" class="ghost">Create an account</button>
  </a>
</div>

{% block home_admin %}{% endblock %} {% endblock %}
