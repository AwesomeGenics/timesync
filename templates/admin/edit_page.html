{% extends 'base.html' %} {% block title %}Edit class{% endblock %} {% block body %}

<div class="topbar">
  <a class="brand" href="/admin_home">TimeSync</a>
</div>

<div class="container">
  <h1>Edit class</h1>

  {% with messages = get_flashed_messages() %} {% if messages %}
  <p class="flash">{{ messages[0] }}</p>
  {% endif %} {% endwith %}

  <div class="card">
    <form class="stacked" action="/edit/{{ link }}" method="post">
      <div>
        <label for="class_name">Class name</label>
        <input type="text" id="class_name" name="edited_class" value="{{ class_name }}" maxlength="59" />
      </div>
      <input type="submit" value="Save" />
    </form>
  </div>
</div>

{% endblock %}
