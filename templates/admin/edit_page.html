{% extends 'base.html' %}
{% block title %}Edit Class — TimeSync{% endblock %}
{% block body %}

<header class="topbar">
  <a class="brand" href="/admin_home">
    <span class="brand-icon">
      <span class="material-symbols-outlined">schedule</span>
    </span>
    <span>TimeSync</span>
  </a>
  <a class="action" href="/admin_home">
    <span class="material-symbols-outlined">arrow_back</span>
    <span>Cancel</span>
  </a>
</header>

<main class="container">
  <div class="page-header">
    <h1>Edit Class</h1>
  </div>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="flash">
    <span class="material-symbols-outlined">info</span>
    <span>{{ messages[0] }}</span>
  </div>
  {% endif %}
  {% endwith %}

  <div class="card">
    <form class="stacked" action="/edit/{{ link }}" method="post">
      <div class="input-group">
        <label for="class_name">
          <span class="material-symbols-outlined">edit_note</span>
          Class Name
        </label>
        <input
          type="text"
          id="class_name"
          name="edited_class"
          value="{{ class_name }}"
          maxlength="59"
          required
          autocomplete="off"
        />
      </div>

      <button type="submit">
        <span class="material-symbols-outlined">save</span>
        Save Changes
      </button>
    </form>
  </div>
</main>

{% endblock %}
