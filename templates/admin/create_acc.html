{%extends 'base.html' %} {%block body%}
<div align="center">
  <h1>Welcome to Account Creation, {{name}}</h1>
  <form action="/create_account" method="post">
    Enter Username:
    <input
      type="text"
      placeholder="preet/y username"
      name="username"
    /><br /><br />
    Enter Password:
    <input
      type="password"
      name="password"
      id=""
      placeholder="keep a secure password or..."
    />
    <br />
    <br />
    <input type="submit" value="Create" />
  </form>
  {% with messages = get_flashed_messages() %} {% if messages %}
  <p>{{ messages[0] }}</p>
  {% endif %} {% endwith %}
</div>
{%endblock%}
