{% extends 'base.html' %}
{% block title %}New Admin — TimeSync{% endblock %}
{% block body %}

<header class="topbar">
  <a class="brand" href="/admin_home">
    <span class="brand-icon">
      <span class="material-symbols-outlined">schedule</span>
    </span>
    <span>TimeSync</span>
  </a>
  <a class="action" href="/admin_home">
    <span class="material-symbols-outlined">arrow_back</span>
    <span>Back</span>
  </a>
</header>

<main class="container">
  <div class="page-header">
    <h1>New Admin</h1>
  </div>

  {% with messages = get_flashed_messages() %}
  {% if messages %}
  <div class="flash">
    <span class="material-symbols-outlined">info</span>
    <span>{{ messages[0] }}</span>
  </div>
  {% endif %}
  {% endwith %}

  <div class="card">
    <form class="stacked" action="/create_account" method="post">
      <div class="input-group">
        <label for="username">
          <span class="material-symbols-outlined">person</span>
          Username
        </label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="e.g. preet"
          maxlength="24"
          required
          autocomplete="off"
        />
      </div>

      <div class="input-group">
        <label for="password">
          <span class="material-symbols-outlined">key</span>
          Password
        </label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          maxlength="24"
          required
          autocomplete="new-password"
        />
      </div>

      <button type="submit">
        <span class="material-symbols-outlined">person_add</span>
        Create Admin
      </button>
    </form>
  </div>
</main>

{% endblock %}
