{% extends 'base.html' %} {% block title %}TimeSync{% endblock %} {% block body %}

<div class="topbar">
  <span class="brand">TimeSync</span>
  <a class="action" href="/login">Admin login</a>
</div>

<div class="container">
  <h1>Find your timetable</h1>
  <p class="subtitle">Pick your branch and section to see the weekly schedule.</p>

  <div class="card">
    <form class="stacked" action="/timetable" method="post">
      <div>
        <label for="branch">Branch</label>
        <select name="branch" id="branch" required>
          <option value="AIML">AIML</option>
          <option value="CSBS">CSBS</option>
          <option value="CSDS">CSDS</option>
          <option value="CSCS">CSCS</option>
          <option value="IT">IT</option>
          <option value="IOT">IOT</option>
          <option value="CE&ME">CE&ME</option>
          <option value="ECE">ECE</option>
          <option value="ECS">ECS</option>
          <option value="EE">EE</option>
        </select>
      </div>

      <div class="field-row">
        <div>
          <label for="semester">Semester</label>
          <select name="semester" id="semester">
            <option value="1">Semester 1</option>
          </select>
        </div>
        <div>
          <label for="section">Section</label>
          <input type="text" id="section" name="section" placeholder="e.g. A" required />
        </div>
      </div>

      <input type="submit" value="Get timetable" />
    </form>
  </div>
</div>

{% endblock %}
